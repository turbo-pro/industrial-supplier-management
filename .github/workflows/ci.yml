name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject stale generated API types
        run: pnpm check:api
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @ism/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend reactor
        run: ./mvnw --batch-mode --no-transfer-progress verify

  infrastructure-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify MySQL, Flyway, MyBatis and Flowable integration
        run: ./mvnw --batch-mode --no-transfer-progress -pl backend/ism-bootstrap -am -Pintegration-test verify

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secret and private environment files
        shell: bash
        run: |
          test ! -f .env
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.p12' -o -name 'id_rsa' \) -print -quit)"
