name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject stale generated API types
        run: pnpm check:api
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @ism/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend reactor
        run: ./mvnw --batch-mode --no-transfer-progress verify

  infrastructure-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify MySQL, Flyway, MyBatis and Flowable integration
        run: ./mvnw --batch-mode --no-transfer-progress -pl backend/ism-bootstrap -am -Pintegration-test verify

  console-reminder-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [console-reminder, portal-auth, portal-management, portal-exit, portal-password, portal-recovery, portal-changes, portal-certificates, portal-submissions]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for real browser verification
        run: pnpm --filter @ism/console exec playwright install --with-deps chrome
      - name: Verify real browser flow with isolated MySQL
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [ "$SCENARIO" = portal-submissions ]; then
            node scripts/verify-reminder-e2e.mjs --portal-submissions
          elif [ "$SCENARIO" = portal-certificates ]; then
            node scripts/verify-reminder-e2e.mjs --portal-certificates
          elif [ "$SCENARIO" = portal-changes ]; then
            node scripts/verify-reminder-e2e.mjs --portal-changes
          elif [ "$SCENARIO" = portal-recovery ]; then
            node scripts/verify-reminder-e2e.mjs --portal-recovery
          elif [ "$SCENARIO" = portal-password ]; then
            node scripts/verify-reminder-e2e.mjs --portal-password
          elif [ "$SCENARIO" = portal-exit ]; then
            node scripts/verify-reminder-e2e.mjs --portal-exit
          elif [ "$SCENARIO" = portal-management ]; then
            node scripts/verify-reminder-e2e.mjs --portal-management
          elif [ "$SCENARIO" = portal-auth ]; then
            node scripts/verify-reminder-e2e.mjs --portal
          else
            node scripts/verify-reminder-e2e.mjs
          fi
      - name: Preserve browser evidence and backend assertion logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scenario }}-e2e
          path: |
            output/playwright/
            .playwright-cli/
            backend/ism-bootstrap/target/failsafe-reports/
          retention-days: 7

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secret and private environment files
        shell: bash
        run: |
          test ! -f .env
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.p12' -o -name 'id_rsa' \) -print -quit)"
