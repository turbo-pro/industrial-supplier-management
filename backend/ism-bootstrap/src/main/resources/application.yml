spring:
  application:
    name: industrial-supplier-management
  datasource:
    url: ${ISM_DB_URL:jdbc:mysql://localhost:3306/industrial_supplier?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${ISM_DB_USERNAME:ism}
    password: ${ISM_DB_PASSWORD:ism}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flowable and the application share one schema in the default deployment.
    # Flowable can initialize first, so Flyway adopts the non-empty schema at V0
    # and still executes application migrations beginning with V1.
    baseline-on-migrate: true
    baseline-version: 0
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    execution:
      thread-name-prefix: ism-task-

server:
  port: ${ISM_SERVER_PORT:8080}
  shutdown: graceful

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    stage: B0

flowable:
  database-schema-update: true
  async-executor-activate: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
