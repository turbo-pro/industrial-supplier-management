spring:
  application:
    name: industrial-supplier-management
  datasource:
    url: ${ISM_DB_URL:jdbc:mysql://localhost:3306/industrial_supplier?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${ISM_DB_USERNAME:ism}
    password: ${ISM_DB_PASSWORD:ism}
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    execution:
      thread-name-prefix: ism-task-

server:
  port: ${ISM_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
