spring:
  application:
    name: industrial-supplier-management
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ISM_DB_URL:jdbc:mysql://localhost:3306/industrial_supplier?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${ISM_DB_USERNAME:ism}
    password: ${ISM_DB_PASSWORD:ism}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flowable and the application share one schema in the default deployment.
    # Flowable can initialize first, so Flyway adopts the non-empty schema at V0
    # and still executes application migrations beginning with V1.
    baseline-on-migrate: true
    baseline-version: 0
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    execution:
      thread-name-prefix: ism-task-
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 17MB

server:
  port: ${ISM_SERVER_PORT:8080}
  shutdown: graceful

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}
    stage: B0

flowable:
  database-schema-update: true
  async-executor-activate: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

ism:
  storage:
    provider: ${ISM_STORAGE_PROVIDER:LOCAL}
    local-root: ${ISM_STORAGE_LOCAL_ROOT:./data/storage}
    chunk-size: ${ISM_STORAGE_CHUNK_SIZE:5242880}
    max-file-size: ${ISM_STORAGE_MAX_FILE_SIZE:104857600}
    upload-ttl: ${ISM_STORAGE_UPLOAD_TTL:PT24H}
  security:
    jwt:
      secret: ${ISM_JWT_SECRET:local-development-secret-change-me-32-bytes}
      access-ttl: ${ISM_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${ISM_JWT_REFRESH_TTL:P7D}
    login:
      max-failures: ${ISM_LOGIN_MAX_FAILURES:5}
      lock-duration: ${ISM_LOGIN_LOCK_DURATION:PT15M}
