        '401': { $ref: '#/components/responses/ApiFailure' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique request key retained for 24 hours; retries must use the same request body.
      schema: { type: string, minLength: 8, maxLength: 128 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiFailure:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FailureResponse' }
  schemas:
    SupplierType:
      type: string
      enum: [MANUFACTURER, TRADER, SERVICE_PROVIDER, CONTRACTOR, OTHER]
    SupplierStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, EXITED]
    SupplierRiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    SupplierContactCommand:
      type: object
      required: [name, primary, sortOrder]
      properties:
        name: { type: string, maxLength: 100 }
        position: { type: string, maxLength: 100 }
        mobile: { type: string, maxLength: 32 }
        telephone: { type: string, maxLength: 32 }
        email: { type: string, format: email, maxLength: 200 }
        primary: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    SaveSupplier:
      type: object
      required: [code, name, type, organizationId, riskLevel, contacts, version]
      properties:
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$' }
        name: { type: string, maxLength: 200 }
        shortName: { type: string, maxLength: 100 }
        unifiedSocialCreditCode: { type: string, pattern: '^$|^[0-9A-Z]{18}$' }
        type: { $ref: '#/components/schemas/SupplierType' }
        industry: { type: string, maxLength: 100 }
        countryCode: { type: string, default: CN }
        province: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 300 }
        legalRepresentative: { type: string, maxLength: 100 }
        registeredCapital: { type: number, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        establishedDate: { type: string, format: date }
        website: { type: string, maxLength: 300 }
        riskLevel: { $ref: '#/components/schemas/SupplierRiskLevel' }
        remark: { type: string, maxLength: 1000 }
        organizationId: { type: string }
        contacts: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SupplierContactCommand' } }
        version: { type: integer, minimum: 0 }
    SupplierContact:
      allOf:
        - $ref: '#/components/schemas/SupplierContactCommand'
        - type: object
          required: [id]
          properties: { id: { type: string } }
    SupplierSummary:
      type: object
      required: [id, organizationId, code, name, type, status, riskLevel, version, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        code: { type: string }
        name: { type: string }
        shortName: { type: string }
        unifiedSocialCreditCode: { type: string }
        type: { $ref: '#/components/schemas/SupplierType' }
        status: { $ref: '#/components/schemas/SupplierStatus' }
        riskLevel: { $ref: '#/components/schemas/SupplierRiskLevel' }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    Supplier:
      allOf:
        - $ref: '#/components/schemas/SaveSupplier'
        - type: object
          required: [id, source, status, createdAt, updatedAt]
          properties:
            id: { type: string }
            source: { type: string }
            status: { $ref: '#/components/schemas/SupplierStatus' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            contacts: { type: array, items: { $ref: '#/components/schemas/SupplierContact' } }
    SupplierPage:
      type: object
      required: [total, page, size, items]
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/SupplierSummary' } }
    ChangeSupplierStatus:
      type: object
      required: [status, version]
      properties:
        status: { $ref: '#/components/schemas/SupplierStatus' }
        reason: { type: string, maxLength: 500 }
        version: { type: integer, minimum: 0 }
    SupplierResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Supplier' } } }]
    SupplierPageResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SupplierPage' } } }]
    AdmissionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVISION_REQUIRED, APPROVED, REJECTED, CANCELLED]
    AdmissionMaterialCommand:
      type: object
      required: [type, name, required, provided, sortOrder]
      properties:
        type: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string, maxLength: 100 }
        fileId: { type: string }
        required: { type: boolean }
        provided: { type: boolean }
        remark: { type: string, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0 }
    SaveAdmissionApplication:
      type: object
      required: [supplierId, purchaseCategory, reason, materials, version]
      properties:
        supplierId: { type: string }
        purchaseCategory: { type: string, maxLength: 100 }
        reason: { type: string, maxLength: 500 }
        expectedAnnualAmount: { type: number, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        materials: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/AdmissionMaterialCommand' } }
        version: { type: integer, minimum: 0 }
    AdmissionSummary:
      type: object
      required: [id, organizationId, supplierId, applicationNo, supplierCode, supplierName, purchaseCategory, status, version, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        supplierId: { type: string }
        applicationNo: { type: string }
        supplierCode: { type: string }
        supplierName: { type: string }
        purchaseCategory: { type: string }
        status: { $ref: '#/components/schemas/AdmissionStatus' }
        version: { type: integer }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdmissionApplication:
      allOf:
        - $ref: '#/components/schemas/AdmissionSummary'
        - type: object
          required: [reason, materials, reviews, createdAt]
          properties:
            reason: { type: string }
            expectedAnnualAmount: { type: number }
            currency: { type: string }
            workflowInstanceId: { type: string }
            decidedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            materials: { type: array, items: { allOf: [{ $ref: '#/components/schemas/AdmissionMaterialCommand' }, { type: object, required: [id], properties: { id: { type: string } } }] } }
            reviews: { type: array, items: { type: object, required: [id, action, fromStatus, toStatus, operatorId, operatedAt], properties: { id: { type: string }, action: { type: string }, fromStatus: { $ref: '#/components/schemas/AdmissionStatus' }, toStatus: { $ref: '#/components/schemas/AdmissionStatus' }, comment: { type: string }, operatorId: { type: string }, operatedAt: { type: string, format: date-time } } } }
    AdmissionPage:
      type: object
      required: [total, page, size, items]
      properties: { total: { type: integer, format: int64 }, page: { type: integer }, size: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/AdmissionSummary' } } }
    ReviewAdmissionApplication:
      type: object
      required: [decision, comment, version]
      properties: { decision: { type: string, enum: [APPROVE, REQUIRE_REVISION, REJECT] }, comment: { type: string, maxLength: 1000 }, version: { type: integer, minimum: 0 } }
    AdmissionResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdmissionApplication' } } }]
    AdmissionPageResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdmissionPage' } } }]
    QualificationTypeStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    QualificationStatus:
      type: string
      enum: [DRAFT, VALID, EXPIRING, EXPIRED, REJECTED, REVOKED, SUPERSEDED]
    SaveQualificationType:
      type: object
      required: [code, name, category, validityRequired, defaultWarningDays, status, version]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string, maxLength: 100 }
        category: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        validityRequired: { type: boolean }
        defaultWarningDays: { type: integer, minimum: 0, maximum: 3650 }
        description: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/QualificationTypeStatus' }
        version: { type: integer, minimum: 0 }
    QualificationType:
      allOf:
        - $ref: '#/components/schemas/SaveQualificationType'
        - type: object
          required: [id, updatedAt]
          properties: { id: { type: string }, updatedAt: { type: string, format: date-time } }
    SaveQualification:
      type: object
      required: [supplierId, typeId, certificateNo, permanent, fileId, version]
      properties:
        supplierId: { type: string }
        typeId: { type: string }
        certificateNo: { type: string, maxLength: 100 }
        issuingAuthority: { type: string, maxLength: 200 }
        issueDate: { type: string, format: date }
        effectiveDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        permanent: { type: boolean }
        warningDays: { type: integer, minimum: 0, maximum: 3650 }
        fileId: { type: string }
        version: { type: integer, minimum: 0 }
    QualificationSummary:
      type: object
      required: [id, organizationId, supplierId, supplierCode, supplierName, typeId, typeCode, typeName, certificateNo, permanent, status, daysUntilExpiry, version, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        supplierId: { type: string }
        supplierCode: { type: string }
        supplierName: { type: string }
        typeId: { type: string }
        typeCode: { type: string }
        typeName: { type: string }
        certificateNo: { type: string }
        expiryDate: { type: string, format: date }
        permanent: { type: boolean }
        status: { $ref: '#/components/schemas/QualificationStatus' }
        daysUntilExpiry: { type: integer }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    Qualification:
      allOf:
        - $ref: '#/components/schemas/QualificationSummary'
        - type: object
          required: [fileId, warningDays, createdAt]
          properties:
            parentQualificationId: { type: string }
            issuingAuthority: { type: string }
            issueDate: { type: string, format: date }
            effectiveDate: { type: string, format: date }
            warningDays: { type: integer }
            fileId: { type: string }
            verificationComment: { type: string }
            verifiedBy: { type: string }
            verifiedAt: { type: string, format: date-time }
            revokedReason: { type: string }
            createdAt: { type: string, format: date-time }
    QualificationPage:
      type: object
      required: [total, page, size, items]
      properties: { total: { type: integer, format: int64 }, page: { type: integer }, size: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/QualificationSummary' } } }
    VerifyQualification:
      type: object
      required: [decision, comment, version]
      properties: { decision: { type: string, enum: [APPROVE, REJECT] }, comment: { type: string, maxLength: 1000 }, version: { type: integer, minimum: 0 } }
    RevokeQualification:
      type: object
      required: [reason, version]
      properties: { reason: { type: string, maxLength: 500 }, version: { type: integer, minimum: 0 } }
    QualificationTypeResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/QualificationType' } } }]
    QualificationTypeListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/QualificationType' } } } }]
    QualificationResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Qualification' } } }]
    QualificationPageResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/QualificationPage' } } }]
    ContractType: { type: string, enum: [PURCHASE, SERVICE, ENGINEERING, FRAMEWORK, OTHER] }
    ContractStatus: { type: string, enum: [DRAFT, ACTIVE, COMPLETED, TERMINATED, EXPIRED] }
    SaveContract:
      type: object
      required: [contractNo, name, supplierId, type, amount, currency, startDate, endDate, ownerId, fileId, version]
      properties:
        contractNo: { type: string }
        name: { type: string, maxLength: 200 }
        supplierId: { type: string }
        type: { $ref: '#/components/schemas/ContractType' }
        amount: { type: number, minimum: 0 }
        currency: { type: string }
        signedDate: { type: string, format: date }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        ownerId: { type: string }
        fileId: { type: string }
        version: { type: integer, minimum: 0 }
    ContractSummary:
      type: object
      required: [id, organizationId, supplierId, supplierCode, supplierName, contractNo, name, type, amount, currency, startDate, endDate, status, version, updatedAt]
      properties: { id: { type: string }, organizationId: { type: string }, supplierId: { type: string }, supplierCode: { type: string }, supplierName: { type: string }, contractNo: { type: string }, name: { type: string }, type: { $ref: '#/components/schemas/ContractType' }, amount: { type: number }, currency: { type: string }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, status: { $ref: '#/components/schemas/ContractStatus' }, version: { type: integer }, updatedAt: { type: string, format: date-time } }
