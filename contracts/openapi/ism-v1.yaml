                validHours: { type: integer, minimum: 1, maximum: 168 }
      responses:
        '200': { description: One-time plaintext invitation token; Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalInvitationIssuedResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
