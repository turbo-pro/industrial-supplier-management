components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique request key retained for 24 hours; retries must use the same request body.
      schema: { type: string, minLength: 8, maxLength: 128 }
  securitySchemes:
    portalBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque portal session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiFailure:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FailureResponse' }
  schemas:
    CorrectionAttachmentListResponse:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                type: object
                required: [id, requirementIndex, fileName]
                properties:
                  id: { type: string }
                  requirementIndex: { type: integer, minimum: 0 }
                  fileName: { type: string }

    PortalAccountChange:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PortalManagedAccount:
      type: object
      required: [id, username, displayName, status, version, liveSessions]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer }
