openapi: 3.0.3
info:
  title: Industrial Supplier Management API
  version: 1.0.0
  description: Versioned public contract. The generated frontend client is derived from this file.
servers:
  - url: /api
paths:
  /console/auth/login:
    post:
      operationId: consoleLogin
      tags: [Console Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsoleLoginCommand' }
      responses:
        '200':
          description: Console login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleTokenPairResponse' }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /console/auth/refresh:
    post:
      operationId: consoleRefreshToken
      tags: [Console Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshCommand' }
      responses:
        '200':
          description: Console token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleTokenPairResponse' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /console/auth/logout:
    post:
      operationId: consoleLogout
      tags: [Console Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutCommand' }
      responses:
        '200':
          description: Console logout succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /console/auth/me:
    get:
      operationId: currentConsoleUser
      tags: [Console Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current platform user and effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleUserSummaryResponse' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /console/auth/change-password:
    post:
      operationId: changeConsolePassword
      tags: [Console Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordCommand' }
      responses:
        '200':
          description: Console password changed and existing sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /console/packages:
    get:
      operationId: listPackages
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Package plans, content: { application/json: { schema: { $ref: '#/components/schemas/PackageListResponse' } } } }
        '403': { $ref: '#/components/responses/ApiFailure' }
    post:
      operationId: createPackage
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePackage' } } } }
      responses:
        '200': { description: Draft package created, content: { application/json: { schema: { $ref: '#/components/schemas/PackageResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /console/packages/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getPackage
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Package detail, content: { application/json: { schema: { $ref: '#/components/schemas/PackageResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
    put:
      operationId: updatePackage
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePackage' } } } }
      responses:
        '200': { description: Draft package updated, content: { application/json: { schema: { $ref: '#/components/schemas/PackageResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /console/packages/{id}/versions:
    post:
      operationId: createPackageVersion
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePackageVersion' } } } }
      responses:
        '200': { description: Draft version created, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersionResponse' } } } }
  /console/package-versions/{id}/validate:
    post:
      operationId: validatePackageVersion
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationResponse' } } } }
  /console/package-versions/{id}/publish:
    post:
      operationId: publishPackageVersion
      tags: [Console Packages]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PublishPackageVersion' } } } }
      responses:
        '200': { description: Version published, content: { application/json: { schema: { $ref: '#/components/schemas/PackageVersionResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{tenantId}/subscription-preview:
    post:
      operationId: previewTenantSubscription
      tags: [Console Tenant Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: packageVersionId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Module and quota impact preview, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPreviewResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{tenantId}/subscription:
    post:
      operationId: assignTenantSubscription
      tags: [Console Tenant Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignSubscription' } } } }
      responses:
        '200': { description: Subscription assigned, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPreviewResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{tenantId}/quota-usage:
    get:
      operationId: getTenantQuotaUsage
      tags: [Console Tenant Subscriptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: quotaCode, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Current quota usage, content: { application/json: { schema: { $ref: '#/components/schemas/QuotaUsageResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants:
    get:
      operationId: listTenants
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant control-plane summaries, content: { application/json: { schema: { $ref: '#/components/schemas/TenantListResponse' } } } }
    post:
      operationId: createTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTenant' } } } }
      responses:
        '200': { description: Tenant pending initialization, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant control-plane detail, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
    put:
      operationId: updateTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTenant' } } } }
      responses:
        '200': { description: Tenant updated, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{id}/initialize:
    post:
      operationId: initializeTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InitializeTenant' } } } }
      responses:
        '200': { description: Tenant initialized, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{id}/suspend:
    post:
      operationId: suspendTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Tenant suspended and sessions invalidated, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{id}/resume:
    post:
      operationId: resumeTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Tenant resumed, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /console/tenants/{id}/cancel:
    post:
      operationId: cancelTenant
      tags: [Console Tenants]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Suspended tenant cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/TenantResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /organizations/tree:
    get:
      operationId: getOrganizationTree
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant organization tree, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTreeResponse' } } } }
  /organizations:
    post:
      operationId: createOrganization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganization' } } } }
      responses:
        '200': { description: Organization created, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /organizations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      operationId: updateOrganization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrganization' } } } }
      responses:
        '200': { description: Organization updated, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
    delete:
      operationId: disableOrganization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Organization disabled, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /organizations/current:
    get:
      operationId: getCurrentOrganization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current operating organization, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentOrganizationResponse' } } } }
  /organizations/switch:
    post:
      operationId: switchOrganization
      tags: [Organizations]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SwitchOrganization' } } } }
      responses:
        '200': { description: Current operating organization changed, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentOrganizationResponse' } } } }
        '403': { $ref: '#/components/responses/ApiFailure' }
  /navigation/menus:
    get:
      operationId: getCurrentMenus
      tags: [Navigation]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Menus granted to current user, content: { application/json: { schema: { $ref: '#/components/schemas/MenuTreeResponse' } } } }
  /access/roles:
    get:
      operationId: listRoles
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleListResponse' } } } }
    post:
      operationId: createRole
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRole' } } } }
      responses:
        '200': { description: Role created, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /access/roles/{id}:
    put:
      operationId: updateRole
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRole' } } } }
      responses:
        '200': { description: Role updated, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /access/roles/{id}/grants:
    put:
      operationId: grantRole
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantRole' } } } }
      responses:
        '200': { description: Role grants replaced, content: { application/json: { schema: { $ref: '#/components/schemas/RoleResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /access/users:
    get:
      operationId: listUsers
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant users, content: { application/json: { schema: { $ref: '#/components/schemas/AccessUserListResponse' } } } }
    post:
      operationId: createUser
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAccessUser' } } } }
      responses:
        '200': { description: User created with forced password change, content: { application/json: { schema: { $ref: '#/components/schemas/AccessUserResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /access/users/{id}/roles:
    put:
      operationId: assignUserRoles
      tags: [Tenant Access]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignUserRoles' } } } }
      responses:
        '200': { description: Roles assigned and existing sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /configuration/dictionaries:
    get:
      operationId: listDictionaries
      tags: [Tenant Configuration]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Effective system and tenant dictionaries, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryTypeListResponse' } } } }
  /configuration/dictionaries/{typeCode}:
    get:
      operationId: getDictionary
      tags: [Tenant Configuration]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: typeCode, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Effective dictionary, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryTypeResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /configuration/dictionaries/{typeCode}/items/{itemCode}:
    put:
      operationId: upsertDictionaryItem
      tags: [Tenant Configuration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: typeCode, in: path, required: true, schema: { type: string } }
        - { name: itemCode, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertDictionaryItem' } } } }
      responses:
        '200': { description: Dictionary override or extension saved, content: { application/json: { schema: { $ref: '#/components/schemas/DictionaryTypeResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
    delete:
      operationId: deleteDictionaryItemOverride
      tags: [Tenant Configuration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: typeCode, in: path, required: true, schema: { type: string } }
        - { name: itemCode, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Tenant override removed, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /configuration/settings:
    get:
      operationId: listTenantSettings
      tags: [Tenant Configuration]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Effective tenant settings, content: { application/json: { schema: { $ref: '#/components/schemas/SettingListResponse' } } } }
  /configuration/settings/{settingKey}:
    put:
      operationId: updateTenantSetting
      tags: [Tenant Configuration]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: settingKey, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTenantSetting' } } } }
      responses:
        '200': { description: Tenant setting saved, content: { application/json: { schema: { $ref: '#/components/schemas/SettingResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /files/uploads:
    post:
      operationId: initializeFileUpload
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InitializeFileUpload' } } } }
      responses:
        '200': { description: Upload initialized or tenant-local instant upload matched, content: { application/json: { schema: { $ref: '#/components/schemas/FileUploadResponse' } } } }
        '413': { $ref: '#/components/responses/ApiFailure' }
  /files/uploads/{id}:
    get:
      operationId: getFileUpload
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Upload progress and uploaded chunk indexes, content: { application/json: { schema: { $ref: '#/components/schemas/FileUploadResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /files/uploads/{id}/chunks/{index}:
    put:
      operationId: uploadFileChunk
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: X-Chunk-SHA256, in: header, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: Chunk stored idempotently, content: { application/json: { schema: { $ref: '#/components/schemas/FileUploadResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /files/uploads/{id}/complete:
    post:
      operationId: completeFileUpload
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: File assembled and verified, content: { application/json: { schema: { $ref: '#/components/schemas/FileObjectResponse' } } } }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '503': { $ref: '#/components/responses/ApiFailure' }
  /files:
    get:
      operationId: listFiles
      tags: [Files]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant files, content: { application/json: { schema: { $ref: '#/components/schemas/FileObjectListResponse' } } } }
  /files/{id}:
    get:
      operationId: getFile
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: File metadata, content: { application/json: { schema: { $ref: '#/components/schemas/FileObjectResponse' } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
    delete:
      operationId: deleteFile
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: File metadata removed, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
  /files/{id}/content:
    get:
      operationId: downloadFile
      tags: [Files]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: File binary content, headers: { Content-Disposition: { schema: { type: string } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /messages/templates:
    get:
      operationId: listMessageTemplates
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Tenant message templates, content: { application/json: { schema: { $ref: '#/components/schemas/MessageTemplateListResponse' } } } } }
    post:
      operationId: createMessageTemplate
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveMessageTemplate' } } } }
      responses: { '200': { description: Template created, content: { application/json: { schema: { $ref: '#/components/schemas/MessageTemplateResponse' } } } } }
  /messages/templates/{id}:
    put:
      operationId: updateMessageTemplate
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveMessageTemplate' } } } }
      responses: { '200': { description: Template updated, content: { application/json: { schema: { $ref: '#/components/schemas/MessageTemplateResponse' } } } }, '409': { $ref: '#/components/responses/ApiFailure' } }
  /messages/send:
    post:
      operationId: sendMessage
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessage' } } } }
      responses: { '200': { description: Message delivery result, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageResponse' } } } } }
  /messages/inbox:
    get:
      operationId: getInbox
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current user inbox, content: { application/json: { schema: { $ref: '#/components/schemas/InboxListResponse' } } } } }
  /messages/inbox/unread-count:
    get:
      operationId: getUnreadMessageCount
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Unread count } }
  /messages/inbox/{id}/read:
    put:
      operationId: markMessageRead
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Message marked read, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } } }
  /messages/inbox/read-all:
    put:
      operationId: markAllMessagesRead
      tags: [Messages]
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: All messages marked read } }
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCommand' }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshCommand' }
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutCommand' }
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
  /auth/me:
    get:
      operationId: currentUser
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummaryResponse' }
        '401': { $ref: '#/components/responses/ApiFailure' }
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordCommand' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResponse' }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique request key retained for 24 hours; retries must use the same request body.
      schema: { type: string, minLength: 8, maxLength: 128 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiFailure:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FailureResponse' }
  schemas:
    SaveMessageTemplate:
      type: object
      required: [code, name, channel, titleTemplate, contentTemplate, requiredVariables, version]
      properties:
        code: { type: string }
        name: { type: string }
        channel: { type: string, enum: [IN_APP, EMAIL, SMS, WE_COM, DINGTALK] }
        titleTemplate: { type: string }
        contentTemplate: { type: string }
        requiredVariables: { type: array, uniqueItems: true, items: { type: string } }
        version: { type: integer, minimum: 0 }
    MessageTemplate:
      allOf: [{ $ref: '#/components/schemas/SaveMessageTemplate' }, { type: object, required: [id, status], properties: { id: { type: string }, status: { type: string } } }]
    SendMessage:
      type: object
      required: [templateCode, recipientIds, variables]
      properties:
        templateCode: { type: string }
        recipientIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        variables: { type: object, additionalProperties: { type: string } }
        businessType: { type: string }
        businessId: { type: string }
    InboxMessage:
      type: object
      required: [id, title, content, createdAt]
      properties: { id: { type: string }, title: { type: string }, content: { type: string }, businessType: { type: string }, businessId: { type: string }, readAt: { type: string, format: date-time }, createdAt: { type: string, format: date-time } }
    MessageTemplateListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/MessageTemplate' } } } }]
    MessageTemplateResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/MessageTemplate' } } }]
    InboxListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/InboxMessage' } } } }]
    SendMessageResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { requested: { type: integer }, delivered: { type: integer }, deliveryIds: { type: array, items: { type: string } } } } } }]
    InitializeFileUpload:
      type: object
      required: [fileName, contentType, totalSize, sha256]
      properties:
        fileName: { type: string, maxLength: 255 }
        contentType: { type: string, maxLength: 150 }
        totalSize: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    FileUpload:
      type: object
      required: [id, fileName, contentType, totalSize, sha256, chunkSize, totalChunks, uploadedChunks, status, expiresAt, version]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        totalSize: { type: integer, format: int64 }
        sha256: { type: string }
        chunkSize: { type: integer }
        totalChunks: { type: integer }
        uploadedChunks: { type: array, items: { type: integer } }
        status: { type: string, enum: [UPLOADING, ASSEMBLING, COMPLETED, EXPIRED] }
        fileId: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        version: { type: integer }
    FileObject:
      type: object
      required: [id, originalName, contentType, size, sha256, provider, status, createdAt]
      properties:
        id: { type: string }
        originalName: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        provider: { type: string, enum: [LOCAL, MINIO, S3] }
        status: { type: string, enum: [ACTIVE] }
        createdAt: { type: string, format: date-time }
    FileUploadResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/FileUpload' } } }]
    FileObjectResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/FileObject' } } }]
    FileObjectListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/FileObject' } } } }]
    DictionaryItem:
      type: object
      required: [id, code, label, value, sortOrder, status, version, source]
      properties:
        id: { type: string }
        code: { type: string }
        label: { type: string }
        value: { type: string }
        sortOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer }
        source: { type: string, enum: [SYSTEM, TENANT_OVERRIDE, TENANT_CUSTOM] }
    DictionaryType:
      type: object
      required: [code, name, tenantExtensible, items]
      properties:
        code: { type: string }
        name: { type: string }
        tenantExtensible: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/DictionaryItem' } }
    UpsertDictionaryItem:
      type: object
      required: [code, label, value, sortOrder, version]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        label: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 200 }
        sortOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
        version: { type: integer, minimum: 0 }
    TenantSetting:
      type: object
      required: [key, valueType, value, version]
      properties:
        key: { type: string }
        valueType: { type: string, enum: [STRING, URL, INTEGER] }
        value: { type: string }
        version: { type: integer }
    UpdateTenantSetting:
      type: object
      required: [value, version]
      properties:
        value: { type: string, maxLength: 2000 }
        version: { type: integer, minimum: 0 }
    DictionaryTypeListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/DictionaryType' } } } }]
    DictionaryTypeResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DictionaryType' } } }]
    SettingListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/TenantSetting' } } } }]
    SettingResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TenantSetting' } } }]
    CreatePackage:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string, maxLength: 100 }
    UpdatePackage:
      type: object
      required: [name, version]
      properties:
        name: { type: string, maxLength: 100 }
        version: { type: integer, minimum: 0 }
    PackageModuleGrant:
      type: object
      required: [moduleCode, enabled, quotas]
      properties:
        moduleCode: { type: string }
        enabled: { type: boolean }
        quotas: { type: object, additionalProperties: { type: integer, format: int64, minimum: 0 } }
    CreatePackageVersion:
      type: object
      required: [versionNo, name, modules]
      properties:
        versionNo: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 100 }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        modules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PackageModuleGrant' } }
    PublishPackageVersion:
      type: object
      required: [version]
      properties: { version: { type: integer, minimum: 0 } }
    PackageVersion:
      type: object
      required: [id, versionNo, name, status, version, modules]
      properties:
        id: { type: string }
        versionNo: { type: integer }
        name: { type: string }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, OFFLINE] }
        version: { type: integer }
        modules: { type: array, items: { $ref: '#/components/schemas/PackageModuleGrant' } }
    PackagePlan:
      type: object
      required: [id, code, name, status, version, versions]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string }
        version: { type: integer }
        versions: { type: array, items: { $ref: '#/components/schemas/PackageVersion' } }
    PackageListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/PackagePlan' } } } }]
    PackageResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PackagePlan' } } }]
    PackageVersionResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PackageVersion' } } }]
    ValidationResult:
      type: object
      required: [valid, errors]
      properties: { valid: { type: boolean }, errors: { type: array, items: { type: string } } }
    ValidationResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ValidationResult' } } }]
    AssignSubscription:
      type: object
      required: [packageVersionId, effectiveFrom]
      properties:
        packageVersionId: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        exceptions: { type: object, additionalProperties: true }
    QuotaChange:
      type: object
      required: [currentLimit, targetLimit, usedValue, exceedsTarget]
      properties:
        currentLimit: { type: integer, format: int64 }
        targetLimit: { type: integer, format: int64 }
        usedValue: { type: integer, format: int64 }
        exceedsTarget: { type: boolean }
    SubscriptionPreview:
      type: object
      required: [tenantId, targetPackageVersionId, removedModules, quotaChanges, recommendations]
      properties:
        tenantId: { type: string }
        currentPackageVersionId: { type: string, nullable: true }
        targetPackageVersionId: { type: string }
        removedModules: { type: array, uniqueItems: true, items: { type: string } }
        quotaChanges: { type: object, additionalProperties: { $ref: '#/components/schemas/QuotaChange' } }
        recommendations: { type: array, items: { type: string } }
    SubscriptionPreviewResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/SubscriptionPreview' } } }]
    QuotaUsage:
      type: object
      required: [quotaCode, limit, used, remaining, warning, hardLimited]
      properties:
        quotaCode: { type: string }
        limit: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        remaining: { type: integer, format: int64 }
        warning: { type: boolean }
        hardLimited: { type: boolean }
    QuotaUsageResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/QuotaUsage' } } }]
    CreateTenant:
      type: object
      required: [code, name, timezone, locale, packageVersionId]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,49}$' }
        name: { type: string, maxLength: 200 }
        timezone: { type: string, example: Asia/Shanghai }
        locale: { type: string, example: zh-CN }
        packageVersionId: { type: string }
    InitializeTenant:
      type: object
      required: [adminUsername, adminDisplayName, initialPassword, headquartersName]
      properties:
        adminUsername: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9._-]{2,99}$' }
        adminDisplayName: { type: string, maxLength: 100 }
        initialPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
        headquartersName: { type: string, maxLength: 200 }
    UpdateTenant:
      type: object
      required: [name, timezone, locale, version]
      properties:
        name: { type: string, maxLength: 200 }
        timezone: { type: string }
        locale: { type: string }
        version: { type: integer, minimum: 0 }
    Tenant:
      type: object
      required: [id, code, name, status, initializationStatus, timezone, locale, packageVersionId, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [PROVISIONING, ACTIVE, SUSPENDED, CANCELLED] }
        initializationStatus: { type: string, enum: [PENDING, READY] }
        timezone: { type: string }
        locale: { type: string }
        packageVersionId: { type: string }
        version: { type: integer }
        initializedAt: { type: string, format: date-time, nullable: true }
    TenantListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Tenant' } } } }]
    TenantResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Tenant' } } }]
    CreateOrganization:
      type: object
      required: [parentId, code, name, type, sortOrder]
      properties:
        parentId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$' }
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [SUBSIDIARY, SITE, DEPARTMENT] }
        sortOrder: { type: integer, minimum: 0 }
    UpdateOrganization:
      type: object
      required: [name, sortOrder, version]
      properties:
        name: { type: string, maxLength: 200 }
        sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    SwitchOrganization:
      type: object
      required: [organizationId]
      properties: { organizationId: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
    OrganizationNode:
      type: object
      required: [id, code, name, type, status, sortOrder, version, children]
      properties:
        id: { type: string }
        parentId: { type: string, nullable: true }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [HEADQUARTERS, SUBSIDIARY, SITE, DEPARTMENT] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        sortOrder: { type: integer }
        version: { type: integer }
        children: { type: array, items: { $ref: '#/components/schemas/OrganizationNode' } }
    CurrentOrganization:
      type: object
      required: [id, code, name, type]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [HEADQUARTERS, SUBSIDIARY, SITE, DEPARTMENT] }
    OrganizationTreeResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationNode' } } } }]
    OrganizationResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/OrganizationNode' } } }]
    CurrentOrganizationResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/CurrentOrganization' } } }]
    MenuNode:
      type: object
      required: [id, code, name, route, component, children]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        route: { type: string }
        component: { type: string }
        icon: { type: string, nullable: true }
        children: { type: array, items: { $ref: '#/components/schemas/MenuNode' } }
    MenuTreeResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/MenuNode' } } } }]
    CreateRole:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string, maxLength: 100 }
    UpdateRole:
      type: object
      required: [name, version]
      properties:
        name: { type: string, maxLength: 100 }
        version: { type: integer, minimum: 0 }
    DataScopeGrant:
      type: object
      required: [resourceCode, scopeType, organizationIds]
      properties:
        resourceCode: { type: string }
        scopeType: { type: string, enum: [TENANT_ALL, ORGANIZATION_SET, PROJECT_SET, OWNED, CREATED, NONE] }
        organizationIds: { type: array, uniqueItems: true, items: { type: string } }
    GrantRole:
      type: object
      required: [permissionCodes, menuCodes, dataScopes]
      properties:
        permissionCodes: { type: array, uniqueItems: true, items: { type: string } }
        menuCodes: { type: array, uniqueItems: true, items: { type: string } }
        dataScopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DataScopeGrant' } }
    Role:
      type: object
      required: [id, code, name, builtIn, status, version]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        builtIn: { type: boolean }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer }
    RoleListResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Role' } } } }]
    RoleResponse:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Role' } } }]
    CreateAccessUser:
      type: object
      required: [username, displayName, initialPassword, primaryOrganizationId, roleIds]
      properties:
        username: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9._-]{2,99}$' }
        displayName: { type: string, maxLength: 100 }
        initialPassword: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 128 }
        primaryOrganizationId: { type: string }
        roleIds: { type: array, uniqueItems: true, items: { type: string } }
    AssignUserRoles:
      type: object
      required: [roleIds]
