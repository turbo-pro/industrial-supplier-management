openapi: 3.0.3
info:
  title: Industrial Supplier Management API
  version: 1.0.0
  description: Versioned public contract. The generated frontend client is derived from this file.
servers:
  - url: /api
paths:
  /suppliers/{supplierId}/portal-accounts/{id}/password-recovery:
    parameters:
      - { name: supplierId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPortalPasswordRecovery
      tags: [Supplier Portal]
      security: [{ bearerAuth: [] }]
      description: Dedicated supplier:portal:recover permission and live supplier data scope. Latest recovery metadata only; no token or hash. Null means never issued. PENDING may be effectively EXPIRED or INVALIDATED.
      responses:
        '200': { description: Latest metadata or null; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalRecoveryStateResponse' } } } }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
    post:
      operationId: issuePortalPasswordRecovery
      tags: [Supplier Portal]
      security: [{ bearerAuth: [] }]
      description: Default disabled, requires dedicated supplier:portal:recover and supplier scope, active supplier/account and no pending exit. Operator must verify identity via trusted channel. 256-bit token returned ONCE, valid 15 minutes, stored hashed; no email sent. Replaces old pending grant and increments management version only. Existing password/sessions remain valid until redemption; use disable/revoke-sessions for suspected compromise. Audit and issuance atomic. No automatic role grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason, identityVerified]
              properties:
                version: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 500 }
                identityVerified: { type: boolean, enum: [true] }
      responses:
        '200': { description: Once-only recovery token; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalRecoveryIssuedResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/portal-accounts/{id}/password-recovery/revoke:
    post:
      operationId: revokePortalPasswordRecovery
      tags: [Supplier Portal]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: Pending grant revoked and version advanced; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /portal/auth/reset-password:
    post:
      operationId: resetPortalPassword
      tags: [Supplier Portal]
      description: Anonymous capability redemption; no tenant/account/email chosen by client. Shared peer rate limit with login/register. Requires deployment recovery and authentication switches. Token binds account management/token versions; expiry, replacement, cancellation, account management, password change or exit invalidate it. Atomically consume token, change password, clear password lock, advance both versions, revoke all sessions and audit. No token returned, login required. Trusted-channel identity verification precedes issuance, not email ownership verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryToken, newPassword]
              properties:
                recoveryToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
                newPassword: { type: string, minLength: 12, maxLength: 72, writeOnly: true, description: Upper/lower/digit/symbol and at most 72 UTF-8 bytes. Must differ from current password. }
      responses:
        '200': { description: Consumed and password reset; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
        '429': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/portal-accounts:
    get:
      operationId: listSupplierPortalAccounts
      tags: [Supplier Portal Accounts]
      description: Internal supplier:master:view plus live supplier scope. No credentials or email returned. Session count is unexpired/unrevoked matching-version sessions, not business eligibility. Cache-Control no-store.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Scoped account page, content: { application/json: { schema: { $ref: '#/components/schemas/PortalAccountPageResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/portal-accounts/{id}/status:
    post:
      operationId: changeSupplierPortalAccountStatus
      tags: [Supplier Portal Accounts]
      description: Internal supplier:master:update plus live scope. Versioned status change atomically revokes all sessions and audits reason. Restoring never restores old tokens. Supplier pending exit or unavailable blocks enable, never disable/revoke. No external recovery claim.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/PortalAccountChange' }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        '200': { description: Updated account; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalManagedAccountResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/portal-accounts/{id}/revoke-sessions:
    post:
      operationId: revokeSupplierPortalAccountSessions
      tags: [Supplier Portal Accounts]
      description: Internal supplier:master:update plus live scope. Revokes all current account sessions with monotonic token/account version and audit, but does not disable future logins. Stale retries return 409; refresh before deciding another action.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalAccountChange' }
      responses:
        '200': { description: Updated account; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalManagedAccountResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /portal/auth/login:
    post:
      operationId: loginSupplierPortal
      tags: [Supplier Portal]
      description: Default disabled. Dedicated opaque portal session, not an employee/Console JWT. Shared transport-peer budget with registration; five wrong passwords lock this portal account for 15 minutes. Session expires after eight hours without sliding refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantCode, username, password]
              properties:
                tenantCode: { type: string, maxLength: 64 }
                username: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{2,63}$' }
                password: { type: string, maxLength: 72, writeOnly: true }
      responses:
        '200': { description: Portal session only; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalSessionResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
        '429': { $ref: '#/components/responses/ApiFailure' }
  /portal/auth/me:
    get:
      operationId: getSupplierPortalIdentity
      tags: [Supplier Portal]
      description: Requires a live opaque portal bearer, never employee/Console JWT. Current bound identity only, not tenant business data. Checks account version, tenant/module/supplier state on every request.
      security: [{ portalBearer: [] }]
      responses:
        '200': { description: Bound identity; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalIdentityResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /portal/profile-changes:
    get:
      operationId: listOwnPortalProfileChanges
      tags: [Supplier Portal]
      security: [{ portalBearer: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Own enterprise requests; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileChangePageResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
    post:
      operationId: submitOwnPortalProfileChange
      tags: [Supplier Portal]
      security: [{ portalBearer: [] }]
      description: One pending request per bound supplier. Request key provides exact-content replay; reuse with different content conflicts. Does not change the master until an employee approves. Session and binding are rechecked under locks in the same write transaction.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitProfileChange' } } }
      responses:
        '200': { description: Submitted or exact replay; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileChangeResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /portal/profile-changes/{id}/cancel:
    post:
      operationId: cancelOwnPortalProfileChange
      tags: [Supplier Portal]
      security: [{ portalBearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 0 } } } } }
      responses:
        '200': { description: Creator withdrew pending request; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileChangeResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/profile-changes:
    get:
      operationId: listSupplierProfileChanges
      tags: [Supplier Master]
      description: Employee supplier:master:view plus supplier data scope. Portal credentials cannot access this realm.
      parameters:
        - { in: path, name: supplierId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Requests and review capability, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileChangePageResponse' } } } }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/profile-changes/{id}/review:
    post:
      operationId: reviewSupplierProfileChange
      tags: [Supplier Master]
      description: Separate supplier:change:review permission and current supplier scope. Approval rechecks supplier base version and exact prior fields, blocks pending exit/unavailable supplier, and atomically writes the allowlist, request result and audit. Stale master must be rejected and resubmitted. Rejection does not change the master.
      parameters:
        - { in: path, name: supplierId, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, comment, version]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                comment: { type: string, minLength: 1, maxLength: 1000 }
                version: { type: integer, minimum: 0 }
      responses:
        '200': { description: Reviewed request, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileChangeResponse' } } } }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /portal/certificate-uploads:
    post:
      operationId: initializeOwnPortalCertificateUpload
      tags: [Supplier Portal]
      description: Own account/enterprise only. PDF/PNG/JPEG, 8 bytes to 10MiB and tenant maximum, 1MiB chunks, 24h expiry. Max 10 initializations/account and 50/enterprise per rolling 24h. Same request key and metadata replay the same upload; changed content conflicts. No hash-only instant upload, file id, storage key or other file metadata.
      security: [{ portalBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateUploadInitialize' } } } }
      responses:
        '200': { description: Owned upload; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateUploadResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '413': { $ref: '#/components/responses/ApiFailure' }
        '429': { $ref: '#/components/responses/ApiFailure' }
  /portal/certificate-uploads/{id}:
    get:
      operationId: getOwnPortalCertificateUpload
      tags: [Supplier Portal]
      security: [{ portalBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Own upload progress; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateUploadResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /portal/certificate-uploads/{id}/chunks/{index}:
    put:
      operationId: putOwnPortalCertificateChunk
      tags: [Supplier Portal]
      description: Checks account binding, session, expiry, chunk size/hash and first-chunk magic bytes. Same bytes may be retried explicitly. Completed uploads cannot be changed.
      security: [{ portalBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
        - { name: X-Chunk-SHA256, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: Recorded progress; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateUploadResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '410': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
        '503': { $ref: '#/components/responses/ApiFailure' }
  /portal/certificate-uploads/{id}/complete:
    post:
      operationId: completeOwnPortalCertificateUpload
      tags: [Supplier Portal]
      description: Always verifies full content size/SHA256 before any tenant-local deduplication. Records audit atomically; rollback retains retryable chunks. Same completed upload replays completion while unexpired. No file id returned.
      security: [{ portalBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 0 } } } } }
      responses:
        '200': { description: Owned completed upload; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateUploadResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '410': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
        '503': { $ref: '#/components/responses/ApiFailure' }
  /portal/certificate-submissions/types:
    get:
      operationId: listOwnPortalCertificateTypes
      tags: [Supplier Portal]
      security: [{ portalBearer: [] }]
      responses:
        '200': { description: Active qualification types; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateTypesResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
  /portal/certificate-submissions:
    get:
      operationId: listOwnPortalCertificateSubmissions
      tags: [Supplier Portal]
      description: Enterprise-bound portal-origin requests only, including pending/rejected ones; never internal review comments or employee drafts. Review outcome is not a current admission decision.
      security: [{ portalBearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { description: Own enterprise requests; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateSubmissionPageResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
    post:
      operationId: submitOwnPortalCertificate
      tags: [Supplier Portal]
      description: Creates an immutable certificate DRAFT for employee verification. Optional renewalParentId and renewalParentVersion must be supplied together for renewal of a currently verified own-enterprise certificate of the same type. At most one pending portal renewal per original; submit/rejection never replace the original. Approval atomically supersedes the unchanged original and verifies the replacement. Future-effective/expired replacements are rejected (no scheduled activation). Only completed unexpired own-account uploads may be consumed once. Same request key/account/normalized command replay; different reuse conflicts. Linked correction requires latest own rejected portal source ID/version and nonblank correctionNote, same type, new owned upload, at most one successor per source. Root and round are server-derived; renewal parent/version are inherited and cannot be overridden. Rejected originals and all files remain immutable. No withdrawal or public internal review comments.
      security: [{ portalBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateSubmit' } } } }
      responses:
        '200': { description: Submitted/replayed request; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalCertificateSubmissionResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '410': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /portal/qualifications:
    get:
      operationId: listOwnPortalQualifications
      tags: [Supplier Portal]
      description: Published certificates of the enterprise bound to the live portal session; requires the current QUALIFICATION entitlement. Employee drafts and rejected drafts are not published. Ignores client tenant/supplier selectors. Expiry computed with the database business date as for the internal register. No-store.
      security: [{ portalBearer: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string, maxLength: 100, default: '' } }
        - { name: status, in: query, schema: { type: string, enum: ['', VALID, EXPIRING, EXPIRED, REVOKED, SUPERSEDED], default: '' } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { description: Bound enterprise published certificates, content: { application/json: { schema: { $ref: '#/components/schemas/PortalQualificationPageResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
  /portal/qualifications/{id}:
    get:
      operationId: getOwnPortalQualification
      tags: [Supplier Portal]
      description: Published certificate field allowlist. No file/storage identifiers, reviewer/organization identifiers or internal verification/revocation comments. Foreign, draft and nonexistent ids all return 404. No-store.
      security: [{ portalBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Certificate, content: { application/json: { schema: { $ref: '#/components/schemas/PortalQualificationResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /portal/qualifications/{id}/content:
    get:
      operationId: downloadOwnPortalQualification
      tags: [Supplier Portal]
      description: Attachment-only octet stream via the authorized certificate, not a file-id endpoint. Rechecks live session inside transaction, requires current entitlement and active file, and audits successful authorization/open (not proof of complete receipt). Historical revoked/superseded originals may be downloaded for reference, not qualification validity. No-store and nosniff. No public storage URL.
      security: [{ portalBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Original certificate attachment
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '403': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
        '503': { $ref: '#/components/responses/ApiFailure' }
  /portal/supplier-profile:
    get:
      operationId: getCurrentPortalSupplierProfile
      tags: [Supplier Portal]
      description: Read-only field allowlist for the supplier bound to the live portal session. No tenant/supplier selector is accepted; headers and query parameters cannot change the binding. Returns active assigned purchase categories only. Internal risk, notes, contacts, legal representative, financial and employee/organization data are excluded. No-store. Draft/enabled archive state is not an admission decision.
      security: [{ portalBearer: [] }]
      responses:
        '200': { description: Own supplier profile; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/PortalSupplierProfileResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '404': { $ref: '#/components/responses/ApiFailure' }
  /portal/auth/logout:
    post:
      operationId: logoutSupplierPortal
      tags: [Supplier Portal]
      description: Revokes only the authenticated portal session atomically with audit. Replaying revoked bearer returns 401. Does not terminate other devices or internal sessions.
      security: [{ portalBearer: [] }]
      responses:
        '200': { description: Revoked; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /portal/auth/password:
    post:
      operationId: changeSupplierPortalPassword
      tags: [Supplier Portal]
      security: [{ portalBearer: [] }]
      description: Portal bearer only. Rechecks tenant, supplier, account and current session inside the write transaction. Verifies current password; wrong attempts share the login five-attempt/15-minute lock. New password must differ and contain upper/lower/digit/symbol, maximum 72 UTF-8 bytes. Password, management/token versions, revocation of ALL sessions and audit commit atomically. Success requires a fresh login; never issues a replacement token. No email recovery or administrator reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
                newPassword: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
      responses:
        '200': { description: Password changed and all sessions revoked; no-store, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResponse' } } } }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '401': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
  /portal/auth/register:
    post:
      operationId: registerSupplierPortalAccount
      tags: [Supplier Portal]
      description: Default disabled. Single-use invitation capability determines tenant/supplier/email; request tenant headers and email fields cannot override binding. Independent portal account only, no employee/role/session created. No email ownership verification. Shared DB peer rate limit 20 well-formed attempts per UTC minute; do not trust arbitrary forwarded client IP headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationToken, username, password]
              properties:
                invitationToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
                username: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{2,63}$' }
                password: { type: string, minLength: 12, maxLength: 72, writeOnly: true, description: Requires upper/lower/digit/symbol and max 72 UTF-8 bytes. }
      responses:
        '200':
          description: Account bound and invitation consumed atomically. No access token is issued. Cache-Control no-store.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [accountId, tenantId, supplierId, username]
                        properties:
                          accountId: { type: string }
                          tenantId: { type: string }
                          supplierId: { type: string }
                          username: { type: string }
        '400': { $ref: '#/components/responses/ApiFailure' }
        '409': { $ref: '#/components/responses/ApiFailure' }
        '422': { $ref: '#/components/responses/ApiFailure' }
        '429': { $ref: '#/components/responses/ApiFailure' }
  /suppliers/{supplierId}/portal-invitations:
    parameters:
      - { name: supplierId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSupplierPortalInvitations
      tags: [Supplier Portal Invitations]
      description: Requires supplier:master:view and current supplier data scope. Returns latest 100 records, never token hashes or plaintext tokens. Does not imply registered portal identities.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Invitation history, content: { application/json: { schema: { $ref: '#/components/schemas/PortalInvitationHistoryResponse' } } } }
